<style>
  :root { --bg:#0b0d0e; --fg:#d7d9d4; --muted:#7d858c; --line:#262c30; --hi:#f2efe6; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 17px/1.65 Georgia, "Times New Roman", serif; }
  main { max-width: 36rem; margin: 0 auto; padding: 12vh max(20px, env(safe-area-inset-left)) 10vh; }
  h1 { font-size: 5rem; line-height: 1; margin: 0 0 .5rem; font-weight: 400; }
  .by, .small, .note { color: var(--muted); font-size: .9rem; }
  .big { font-size: 1.35rem; color: var(--hi); }
  a { color: var(--hi); }
  form { display: grid; gap: .75rem; margin-top: 2rem; }
  input { font: 1rem ui-monospace, Menlo, Consolas, monospace; padding: .8rem; background: #121619; color: var(--hi); border: 1px solid var(--line); border-radius: 4px; width: 100%; }
  input:focus { outline: 2px solid var(--muted); outline-offset: 2px; }
  button { justify-self: start; font: inherit; font-size: .95rem; padding: .5rem 1.1rem; background: none; color: var(--hi); border: 1px solid var(--muted); border-radius: 4px; cursor: pointer; }
  .sig { margin-top: 2.5rem; font-style: italic; }
  footer { margin-top: 4rem; padding-top: 1rem; border-top: 1px solid var(--line); }
</style>
</head>

<main>
  <div id="page">
    <h1>*</h1>
    <p>this page is locked with a sentence. the footnotes know it.</p>
    <form id="f" autocomplete="off">
      <label for="s" class="note">twelve words, in order. case and punctuation don't matter.</label>
      <input id="s" spellcheck="false" autocapitalize="off">
      <button>open</button>
      <p id="msg" class="note" role="status"></p>
    </form>
    <p class="note">lost? the first footnote is on <a href="https://github.com/connabyss">github.com/connabyss</a>, in the part most people never open.</p>
  </div>
  <footer class="small">an art piece by connabyss. the lock is real: AES-GCM, key from PBKDF2 of the sentence, all in your browser. view source if you like.</footer>
</main>

const norm = (s) => s.toLowerCase().replace(/[^a-z]+/g, " ").trim();
const bytes = (b) => Uint8Array.from(atob(b), (ch) => ch.charCodeAt(0));
async function open(sentence) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(sentence)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(LOCKED.salt), iterations: LOCKED.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const out = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(LOCKED.iv) }, key, bytes(LOCKED.ct));
  return new TextDecoder().decode(out);
}

  const msg = document.getElementById("msg");
  const words = norm(document.getElementById("s").value).split(" ").filter(Boolean).length;
  msg.textContent = "...";
  try {
    const page = document.getElementById("page");
    page.innerHTML = await open(document.getElementById("s").value);
    // scripts set by innerHTML don't run on their own, so run the opened page's scripts
    for (const old of page.querySelectorAll("script")) { const s = document.createElement("script"); s.textContent = old.textContent; old.replaceWith(s); }
    document.title = "* found";
  } catch {
    msg.textContent = words === 12 ? "*not quite. check the order." : `*that's ${words} word${words === 1 ? "" : "s"}. there are twelve.`;
