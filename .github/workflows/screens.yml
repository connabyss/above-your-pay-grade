name: live screenshots
# Screenshots of the LIVE site for the submission, pushed to the "screens" branch.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: mkdir -p screens && node tools/screens.cjs
      - name: push to the screens branch
        run: |
          cd screens
          git init -q -b screens && git add . 
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "live screenshots"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screens
